<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Generated from the same bitmap as the header mark by scripts/favicon.mjs.
       SVG first for anything modern; the PNGs are for browsers that ignore an
       SVG icon, and apple-touch-icon because iOS has never supported one. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12120F" media="(prefers-color-scheme: dark)" />
  <!--
    Everything between the seo markers is replaced per route at build time by
    scripts/prerender.js (source of truth: src/lib/seo.js). The tags below are
    the home-page defaults and are what `vite dev` serves.
  -->
  <!--seo-start-->
  <title>PDF Splitter — Split, Merge & Compress PDFs Without Uploading</title>
  <meta name="description"
    content="Split, merge, compress and reorder PDFs entirely in your browser. Your files never leave your device — no uploads, no accounts. Verify it in devtools." />
  <meta property="og:title" content="PDF Splitter — Your files never leave your device" />
  <meta property="og:description"
    content="Client-side PDF toolkit. Split, merge, compress, reorder and convert images to PDF with nothing uploaded to a server." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <!--seo-end-->

  <!--
    Resolve the theme before first paint. Without this the page renders light,
    then snaps to dark a frame later - a flash of the wrong colour scheme on
    every single load for dark-mode users.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pdftools-theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* storage blocked - CSS media query still handles it */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
